{% extends 'base.html' %}

{% block title %}Sign In - GlanAudit{% endblock %}

{% block extra_css %}
<style>
    .login-container {
        max-width: 440px;
        margin: 40px auto;
    }

    .panel {
        background-color: #0f1623;
        border: 1px solid #1e293b;
        border-radius: 8px;
        padding: 36px 32px;
    }

    .login-header {
        text-align: center;
        margin-bottom: 28px;
    }

    .login-header h2 {
        margin: 0 0 8px 0;
        font-size: 22px;
        font-weight: 700;
        color: #ffffff;
    }

    .login-header p {
        margin: 0;
        font-size: 13px;
        color: #94a3b8;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 20px;
    }

    .form-group label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #94a3b8;
        margin-bottom: 8px;
    }

    .form-group input {
        background-color: #172033;
        border: 1px solid #26334d;
        border-radius: 6px;
        color: #ffffff;
        padding: 12px 14px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.15s ease-in-out;
        font-family: inherit;
        box-sizing: border-box;
        width: 100%;
    }

    .form-group input:focus {
        border-color: #20BF55;
    }

    .btn-submit {
        background-color: #20BF55 !important;
        color: #090d16 !important;
        font-weight: 700 !important;
        font-size: 14px !important;
        padding: 12px 20px !important;
        border: none !important;
        border-radius: 6px !important;
        width: 100%;
        cursor: pointer;
        transition: background-color 0.15s ease-in-out !important;
        margin-top: 8px;
    }
    .btn-submit:hover {
        background-color: #199e45 !important;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="panel">
        <div class="login-header">
            <h2>Sign In to GlanAudit</h2>
            <p>Enter your account credentials to access your fleet portal</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="e.g. driver@oconnellgroup.ie" required autofocus>
            </div>

            <div class="form-group">
                <label>Access PIN</label>
                <input type="password" name="pin_code" placeholder="••••" maxlength="10" required>
            </div>

            <button type="submit" class="btn-submit">Sign In &rarr;</button>
        </form>
    </div>
</div>
{% endblock %}
